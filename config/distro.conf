# ============================================================
#  Neo Orión OS — configuración central del build
#  Todo lo que quieras renombrar o activar/desactivar está aquí.
# ============================================================

# --- Identidad ---------------------------------------------------
DISTRO_NAME="Neo Orión OS"
DISTRO_ID="neo-orion"            # sin espacios ni tildes (nombre de archivo, hostname)
DISTRO_VERSION="${DISTRO_VERSION:-0.3}"
DISTRO_CODENAME="Polaris"
ISO_LABEL="NEO_ORION_01"         # máx. 32 caracteres, sin espacios
LIVE_USER="orion"                # usuario de la sesión Live
HOSTNAME_DEFAULT="neo-orion"

# --- Base Ubuntu ----------------------------------------------------
UBUNTU_SUITE="noble"             # 24.04 LTS (necesario para ROS 2 Jazzy)
ARCH="amd64"
MIRROR="http://archive.ubuntu.com/ubuntu"
# Mirror más cercano a Chile (opcional, descomenta si es más rápido):
# MIRROR="http://cl.archive.ubuntu.com/ubuntu"

# --- Región ----------------------------------------------------------
LOCALE_MAIN="es_CL.UTF-8"
LOCALES_EXTRA="en_US.UTF-8"      # ROS 2 recomienda tener en_US.UTF-8 disponible
TIMEZONE="America/Santiago"
KEYBOARD_LAYOUT="latam"

# --- Edición -----------------------------------------------------------
#   full  : todo (ROS 2 + Gazebo + CAD/EDA + IA)            ISO ~6-7 GB
#   lite  : escritorio + dev + CLI orion (ROS se instala con `orion install ros2`)  ~3 GB
#   test  : solo base booteable en consola, para probar el pipeline  ~1 GB
EDITION="${EDITION:-full}"          # full | lite | patata (PC viejo 2–4 GB, sin escritorio) | test

# --- Módulos (yes/no). Se pueden pisar por variable de entorno ----------
WITH_DESKTOP="${WITH_DESKTOP:-yes}"     # KDE Plasma + tema HUD
WITH_DEV="${WITH_DEV:-yes}"             # compiladores, Python/uv, Node, Docker, VS Code
WITH_ROBOTICS="${WITH_ROBOTICS:-yes}"   # ROS 2 Jazzy, Gazebo, MoveIt
WITH_MAKER="${WITH_MAKER:-yes}"         # ESP32/Arduino/STM32, KiCad, FreeCAD, slicers
WITH_AI="${WITH_AI:-yes}"               # Ollama + herramientas de IA
WITH_GAMING="${WITH_GAMING:-yes}"     # Steam, GeForce NOW, emuladores, Moonlight, Jellyfin, Kodi
WITH_INSTALLER="${WITH_INSTALLER:-yes}" # instalador gráfico Calamares
SECURE_BOOT="${SECURE_BOOT:-yes}"       # usa shim/grub firmados por Canonical

# --- Rutas de trabajo ---------------------------------------------------
WORK_DIR="${WORK_DIR:-$PWD/work}"
OUT_DIR="${OUT_DIR:-$PWD/out}"
SQUASHFS_COMP="${SQUASHFS_COMP:-xz}"    # xz = más chico | zstd = build más rápido
