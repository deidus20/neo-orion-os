# Neo Orión · núcleo nativo en Rust (reemplaza a los servicios Python, uno por uno)
[workspace]
resolver = "2"
members = ["orion-nucleo"]

[workspace.package]
edition = "2021"
version = "0.9.0"
license = "GPL-3.0-only"
authors = ["Davis Reyes"]

# binarios chicos y rápidos: lo que importa en un PC patata
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
