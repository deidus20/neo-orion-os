<style>
:root{--bg:#0d0e10;--panel:#141518;--line:#2a2c30;--lime:#ff2438;--lime-d:#9e1624;--acc-bg:#170a0c;--red:#ffd400;--ink:#111;--grey:#8b8e94;--dim:#55585e;--txt:#e6e8ea;
  --px:'Silkscreen',monospace;--mono:'JetBrains Mono',monospace}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
[hidden]{display:none!important}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px}
body{background-image:radial-gradient(#202226 1px,transparent 1.2px);background-size:22px 22px;overflow:hidden}

.reg{position:fixed;width:16px;height:16px;border-color:var(--grey);opacity:.55;z-index:5}
.reg.a{left:12px;top:12px;border-left:1px solid;border-top:1px solid}.reg.b{right:12px;top:12px;border-right:1px solid;border-top:1px solid}
.reg.c{left:12px;bottom:12px;border-left:1px solid;border-bottom:1px solid}.reg.d{right:12px;bottom:12px;border-right:1px solid;border-bottom:1px solid}

#intro{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--bg);cursor:pointer}
#intro .logo{font-family:var(--px);font-size:clamp(46px,12vw,110px);line-height:.88;text-align:center;color:#fff;text-shadow:0 0 22px #fff4}

nav .st.hecho{color:var(--grey)} nav .st.hecho i{background:var(--lime-d);border-color:var(--lime-d)}

main{overflow:auto;padding:30px clamp(18px,4vw,56px) 40px;position:relative}
footer{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:12px 26px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#0b0c0dcc}
footer .seg{flex:1;display:flex;gap:3px;max-width:420px}
footer .seg i{flex:1;height:6px;background:#222}footer .seg i.on{background:var(--lime)}
.btn{white-space:nowrap;font-family:var(--px);font-size:12px;letter-spacing:.06em;border:1px solid var(--lime);background:var(--lime);color:var(--ink);padding:11px 20px;cursor:pointer;position:relative;overflow:hidden}
.btn:hover{box-shadow:0 0 18px var(--lime)}
.btn.sec{background:transparent;color:var(--grey);border-color:#3a3d42}

.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

.kick::after{content:"";flex:1;height:1px;background:var(--line);max-width:260px}
h1 canvas{display:block;max-width:100%;height:auto}

.ico{display:inline-block;vertical-align:middle;margin-right:8px}

.op .inf{position:absolute;right:30px;bottom:8px;width:16px;height:16px;border:1px solid var(--grey);background:none;color:var(--grey);font-family:var(--px);font-size:9px;cursor:pointer;padding:0}.op.sel .inf{border-color:var(--ink);color:var(--ink)}
.det{max-height:70vh;overflow:auto}
.pwb{display:flex;gap:3px;min-height:14px;margin-top:4px}.pwb i{width:12px;height:12px;background:var(--lime);display:block}.pwb i:nth-child(odd){background:#fff}
#col{position:fixed;right:22px;top:40%;font-family:var(--px);font-size:11px;line-height:1.25;color:#3a3d42;white-space:pre;text-align:right;z-index:1}
h1{font-family:var(--px);font-weight:400;font-size:clamp(26px,4.4vw,44px);line-height:1;margin:10px 0 10px;color:#fff;text-transform:uppercase}
.lead{color:var(--grey);max-width:620px;line-height:1.55;margin-bottom:22px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.op{border:1px solid #2c2f33;background:#0f1012;padding:13px;cursor:pointer;position:relative;transition:border-color .15s}
.op:hover{border-color:var(--lime-d)}
.op.sel{border-color:var(--lime);background:var(--lime);color:var(--ink)}
.op.sel .n,.op.sel .d,.op.sel .k,.op.sel .k span{color:var(--ink)!important}.op.sel .fit{background:#0003}.op.sel .fit i{background:var(--ink)}.op.sel .chk{background:#111!important;border-color:var(--ink)!important}.op.sel::before{display:none}

.op .k{font-family:var(--px);font-size:8px;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:6px}
.op .n{font-family:var(--px);font-size:14px;color:#fff;margin-bottom:4px}
.op .d{font-size:11px;color:var(--grey);line-height:1.45}
.op .chk{position:absolute;right:10px;bottom:10px;width:12px;height:12px;border:1px solid var(--dim)}
.op.sel .chk{background:var(--lime);border-color:var(--lime)}
.op.no{opacity:.4;cursor:not-allowed}
.tag{font-family:var(--px);font-size:8px;padding:2px 5px;border:1px solid currentColor}
.fit{height:6px;background:#222;margin-top:8px;position:relative}.fit i{position:absolute;inset:0;right:auto;background:var(--lime)}
.fit.lento i{background:#ffb000}.fit.no i{background:var(--red)}
.campo{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:420px}
.campo label{font-family:var(--px);font-size:9px;color:var(--grey)}
.campo input,.campo select{background:#0b0c0d;border:1px solid #3a3d42;padding:11px 12px;outline:0}
.campo input:focus,.campo select:focus{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
.fila{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.caja{border:1px solid var(--line);padding:14px;background:#0f1012}
.scan{font-size:12px;line-height:1.9}
.scan .l{display:flex;gap:12px}.scan .l span:first-child{width:90px;color:var(--grey);font-family:var(--px);font-size:9px;padding-top:3px}
.tier{display:flex;gap:4px;margin:14px 0 6px}.tier i{flex:1;height:26px;background:#1b1d21;display:grid;place-items:center;font-family:var(--px);font-size:8px;color:var(--dim);font-style:normal}
.tier i.on{background:var(--lime);color:var(--ink)}
.disco{display:flex;height:34px;border:1px solid #3a3d42;margin:10px 0 6px}
.disco div{display:grid;place-items:center;font-family:var(--px);font-size:8px;color:var(--ink);overflow:hidden;white-space:nowrap;transition:flex .5s}
.sw{width:42px;height:42px;border:1px solid #3a3d42;cursor:pointer;position:relative}
.sw.sel{outline:2px solid #fff;outline-offset:2px}
.sw span{position:absolute;left:0;right:0;bottom:-16px;font-family:var(--px);font-size:7px;color:var(--grey);text-align:center}
.prev{border:1px solid var(--lime);padding:14px;min-width:260px;background:#0b0c0d}
.prev .vu{display:flex;gap:2px;align-items:center;height:24px;margin:10px 0}.prev .vu i{width:3px;background:var(--lime);display:block}
.blk{display:flex;gap:5px;margin:10px 0}.blk i{width:18px;height:18px;background:#222;display:block}.blk i.on{background:var(--lime);box-shadow:0 0 8px var(--lime)}
.log{font-size:11px;line-height:1.7;color:var(--grey);max-height:40vh;overflow:auto;border:1px solid var(--line);padding:10px 12px;background:#0a0b0c}
.log b{color:var(--lime);font-weight:400}
.big{font-family:var(--px);font-size:clamp(40px,9vw,88px);line-height:1;color:#fff}
.aviso{border:1px solid var(--red);color:#ffb3a5;padding:12px;max-width:620px;margin:12px 0;background:#1a0f0d;font-size:12px;line-height:1.5}
.aviso b{color:var(--red);font-family:var(--px);font-weight:400;font-size:10px;display:block;margin-bottom:4px}
pre.json{font-size:10px;color:var(--lime);background:#0a0b0c;border:1px solid var(--line);padding:10px;max-height:34vh;overflow:auto;white-space:pre-wrap}
@media (max-width:760px){
  body{overflow:auto}
  #app{position:static;display:block;min-height:100%}
  nav{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px 8px}
  nav .st{padding:6px 10px;white-space:nowrap}nav .st span.nm{display:none}nav .st.act span.nm{display:inline}nav .sum{display:none}
  main{padding:20px 16px 110px}
  footer{position:fixed;left:0;right:0;bottom:0}
  header .tick{display:none}
  #fpaso{display:none}footer .btn{padding:10px 14px}
}
</style>

<script>
const $ = s => document.querySelector(s);
/* ---------------- estado de la instalación ---------------- */
const C = { idioma: 'es-CL', teclado: 'latam', zona: 'America/Santiago', equipo: null, disco: null, modo: 'borrar', confirmado: false,
  ia: [], nube: [], oido: 'faster-whisper', voz: 'piper', memoriaApp: 'obsidian', nombre: 'Neo Orión', genero: 'femenina', tono: 'cercano',
  color: window.ACC, modulos: ['robotica', 'maker', 'proyectos', 'juegos', 'dev'], capa: 'base', usuario: '', equipoNombre: 'orion', frase: false };

/* ---------------- servidor local (en el pendrive real) ---------------- */
// Servido por orion_core.servidor en http://127.0.0.1:7700 → datos y acciones reales.
// Abierto como archivo o en la vista previa → todo simulado, igual que antes.
const API = { si: false, eq: null, sinMic: false, clave: '' };
async function api(ruta, datos) {
  const r = await fetch(ruta, datos === undefined ? { headers: { 'X-Orion': '1' } } : { method: 'POST', headers: { 'X-Orion': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(datos) });
  return r.json();
}
const LISTO_API = (async () => { if (!location.protocol.startsWith('http')) return;
  try { const e = await api('/api/estado'); if (e.modo !== 'instalador') return; API.si = true; API.eq = await api('/api/equipo'); API.sinMic = !API.eq.microfono; } catch (e) {} })();
function perfilReal(q) { // equipo real → mismo formato que PERFILES
  const ram = Math.round(q.ram_gb), vram = q.vram_gb || 0;
  const k = vram >= 20 ? 'estacion' : vram >= 8 ? 'potente' : ram <= 4.5 || !q.avx2 ? 'patata' : ram >= 16 ? 'medio' : 'liviano';
  return { k, n: 'ESTE EQUIPO', ram, vram, d: (q.gpu || '').slice(0, 26) };
}
/* ---------------- hardware real del navegador + perfiles ---------------- */
function detectar() {
  let gpu = '';
  try { const c = document.createElement('canvas').getContext('webgl'); const e = c.getExtension('WEBGL_debug_renderer_info'); gpu = e ? c.getParameter(e.UNMASKED_RENDERER_WEBGL) : ''; } catch (e) {}
  gpu = gpu.replace(/ANGLE \(|\)$|Direct3D.*|OpenGL.*|\(0x.*?\)/g, '').replace(/,.*$/, '').trim();

}
const PERFILES = [
  { k: 'micro', n: 'RASPBERRY PI 5', ram: 8, vram: 0, d: 'nodo de robot' },
  { k: 'patata', n: 'PC PATATA', ram: 2, vram: 0, d: 'viejo, 2–4 GB, sin GPU' },
  { k: 'liviano', n: 'NOTEBOOK BÁSICO', ram: 8, vram: 0, d: 'sin GPU dedicada' },
  { k: 'medio', n: 'NOTEBOOK 16 GB', ram: 16, vram: 0, d: 'iGPU' },
  { k: 'potente', n: 'TORRE RTX 3060', ram: 32, vram: 12, d: 'GPU 12 GB' },

    const cfg = configuracion();
    $('#fin').innerHTML = `<div class="caja mx-in mx-cruz" style="margin-top:20px;background:var(--lime);color:var(--ink);border-color:var(--lime)"><div id="okfin" style="margin:6px 0 10px"></div><div class="px" style="font-size:16px">INSTALACIÓN COMPLETA</div>
      <p style="margin:6px 0 12px;color:var(--ink)">Al reiniciar no hay escritorio: pantalla vacía y ${C.nombre} escuchando. Di tu frase para entrar.</p>
      <div class="fila"><button class="btn" id="rein">REINICIAR ▸</button><button class="btn sec" id="ver">VER CONFIGURACIÓN</button><a class="btn sec" href="index.html" style="text-decoration:none">ABRIR EL HUD</a></div>
      <pre class="json" id="json" hidden>${JSON.stringify(cfg, null, 2)}</pre></div>`;
    $('#okfin').append(MX.pixel('check', { px: 12, gap: 2, color: () => window.INK, ms: 500 }));
    document.querySelectorAll('#fin .btn').forEach(b => { b.style.background = '#111'; b.style.color = 'var(--lime)'; b.style.borderColor = '#111'; });
    $('#ver').onclick = () => $('#json').hidden = !$('#json').hidden;
    $('#rein').onclick = () => API.si ? MX.corte(() => { api('/api/reiniciar', {}); document.body.innerHTML = '<div style="display:grid;place-items:center;height:100vh;font-family:Silkscreen,monospace;color:var(--lime)">REINICIANDO · SACA EL PENDRIVE</div>'; })
      : MX.corte(() => { location.href = 'index.html'; });
    if (API.si) $('#fin').querySelector('a').remove();
    try { const u = new SpeechSynthesisUtterance(`Instalación completa. Soy ${C.nombre}. Reinicia cuando quieras.`); u.lang = C.idioma; speechSynthesis.speak(u); } catch (e) {}
  }
}

/* ---------------- arranque ---------------- */
(function intro() {
  const code = ['[ OK ] firmware uefi · arranque seguro', '[ OK ] casper · imagen en vivo montada', '[ OK ] detectando hardware', '[ OK ] red: ethernet', '[ OK ] audio: pipewire',
    '[ OK ] instalador orion · v0.8', '[ .. ] esperando a la persona'];
  code.forEach((l, i) => setTimeout(() => $('#code').textContent += l + '\n', 150 + i * 160));
  $('#chk').innerHTML = '<i></i>'.repeat(10);
  let k = 0; const t = setInterval(() => { k++; document.querySelectorAll('#chk i').forEach((x, i) => x.classList.toggle('on', i < k)); if (k >= 10) { clearInterval(t); MX.scramble($('#imsg'), 'TOCA O PRESIONA UNA TECLA PARA EMPEZAR', 600); } }, 140);
  const tam = innerWidth < 600 ? 7 : 12;
  $('#logo').append(MX.pixel('NEO', { px: tam, color: '#ffffff', ms: 700 }), document.createElement('br'), MX.pixel('ORIÓN', { px: tam, ms: 1000 }));
  $('#logo').querySelectorAll('canvas').forEach(c => { c.style.margin = (tam * .8) + 'px auto'; c.style.display = 'block'; });
  let b = 0; const ib = setInterval(() => { b += 4 + Math.random() * 9; $('#ibar').style.width = Math.min(100, b) + '%'; if (b >= 100) clearInterval(ib); }, 90);
  MX.columna($('#col'), 12);
  setInterval(() => MX.glitch($('#logo')), 2600);
  const clk = () => { const s = new Date().toTimeString().slice(0, 8); $('#iclk').textContent = s; $('#hclk').textContent = s; }; clk(); setInterval(clk, 1000);
  const d = detectar(); $('#hram').textContent = d.ram; $('#hcpu').textContent = d.cpu; $('#hgpu').textContent = d.gpu.slice(0, 18);
  LISTO_API.then(() => { if (!API.si) return; const q = API.eq; $('#hram').textContent = q.ram_gb + ' GB'; $('#hcpu').textContent = q.hilos; $('#hgpu').textContent = q.gpu.slice(0, 18);
    $('#code').textContent = $('#code').textContent.replace('firmware uefi · arranque seguro', q.uefi ? 'firmware uefi · arranque seguro' : 'firmware bios (legado)'); $('#code').textContent += '[ OK ] equipo medido: ' + q.ram_gb + ' GB · ' + q.discos.length + ' disco(s)\n'; });
  const go = async () => { if ($('#intro').hidden) return; removeEventListener('keydown', go); await LISTO_API;
    MX.corte(() => { $('#intro').hidden = true; $('#app').hidden = false; PASOS[0].r($('#main')); nav(); animarEntrada(); }); };
  $('#intro').onclick = go; addEventListener('keydown', go);
  MX.glitchAzar('#main h1, header .brand', 5200);
})();
</script>
